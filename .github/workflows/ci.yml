name: Iron Tanks CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irontanks-multibuild-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source architecture and port invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Iron Tanks
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate independent Stonecutter builds
        run: python scripts/validate-stonecutter.py

      - name: Validate layered source tree
        run: python scripts/validate-source-families.py

      - name: Verify Iron Tanks port invariants
        run: python scripts/verify_port.py

      - name: Test external localization staging and packaging
        run: python -m unittest discover -s scripts/tests -p test_localization_packaging.py -v

      - name: Test original Iron Tanks normal-tank contract across targets
        run: python -m unittest discover -s scripts/tests -p test_tank_parity.py -v

      - name: Test pinned BCCE Fabric GitHub release dependency
        run: python -m unittest discover -s scripts/tests -p test_fabric_bcce_release_dependency.py -v

      - name: Test Fabric recipes, Gradle source dependencies and release matrix
        run: |
          python -m unittest discover -s scripts/tests -p test_fabric_recipe_loading.py -v
          python -m unittest discover -s scripts/tests -p test_fabric_gradle_resource_dependencies.py -v
          python -m unittest discover -s scripts/tests -p test_release_publish_matrix.py -v

  build:
    name: Build ${{ matrix.generation }} targets
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - generation: legacy
            java: '17'
          - generation: modern
            java: '21'
          - generation: 26.X
            java: '25'
    env:
      BUILD_GENERATION: ${{ matrix.generation }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
    steps:
      - name: Checkout Iron Tanks
        uses: actions/checkout@v4

      - name: Checkout external Iron Tanks localizations
        uses: actions/checkout@v4
        with:
          repository: BCCE-team/Localizations
          ref: main
          path: build/external/localizations
          persist-credentials: false

      - name: Set up Java toolchains
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrappers executable
        run: chmod +x builds/legacy/gradlew builds/modern/gradlew builds/26.X/gradlew build-all.sh scripts/source_layout.py scripts/embed_localizations.py

      - name: Build Iron Tanks generation
        shell: bash
        run: |
          set -euo pipefail
          cd "builds/${BUILD_GENERATION}"
          ./gradlew --no-daemon --console=plain --stacktrace buildAndCollect

      - name: Verify external translations inside every production JAR
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^common\.mod\.version=//p' build-config/common.properties)"
          mapfile -t targets < <(python scripts/validate-stonecutter.py --list-targets --generation "$BUILD_GENERATION")
          for target in "${targets[@]}"; do
            # The production 26.X aggregate includes 26.3-fabric as well.
            minecraft="${target%-*}"
            loader="${target##*-}"
            jar="build/libs/${BUILD_GENERATION}/${version}/IronTanks-Community-Edition-${version}+${minecraft}+${loader}.jar"
            python scripts/embed_localizations.py verify-jar \
              --source build/external/localizations \
              --english source-shared/src/main/resources/assets/irontanks/lang/en_us.json \
              --english-guide source-shared/src/main/resources/assets/irontanks/guide/text/en_us.json \
              --jar "$jar"
            if [[ "$target" == '26.3-fabric' ]]; then
              python scripts/verify_fabric_release_jar.py --jar "$jar" --version "$version"
            fi
          done

      - name: Upload production jars and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irontanks-${{ matrix.generation }}-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/libs/${{ matrix.generation }}/**
            builds/${{ matrix.generation }}/versions/*/build/libs/**
            builds/${{ matrix.generation }}/versions/*/build/reports/**
            run/${{ matrix.generation }}/*/logs/**
            run/${{ matrix.generation }}/*/crash-reports/**
